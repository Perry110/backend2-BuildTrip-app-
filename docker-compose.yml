version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ${DB_NAME}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${DB_NAME}_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:6379'
    command: >
      sh -c "if [ -n \"$REDIS_PASSWORD\" ];
      then redis-server --requirepass \"$REDIS_PASSWORD\";
      else redis-server; fi"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'if [ -n "$REDIS_PASSWORD" ]; then redis-cli -a "$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
